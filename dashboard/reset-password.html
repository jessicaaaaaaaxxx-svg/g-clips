<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置新密码 · G Clips 创作者中心</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/app.css">
</head>
<body>
  <div class="auth-split">
    <aside class="auth-visual-panel">
      <a class="auth-visual-back" href="../index.html">← 返回官网</a>
      <div class="auth-visual-body">
        <div class="auth-visual-badge"><span></span>找回账号</div>
        <h1>设置一个<br><em>新的密码</em></h1>
        <p>为了你的账号安全，请设置一个至少 6 位的新密码。</p>
      </div>
      <div class="auth-visual-foot">© 2026 G Clips</div>
      <div class="auth-orb orb-a"></div>
      <div class="auth-orb orb-b"></div>
    </aside>

    <main class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-brand"><span class="mark">G</span> G CLIPS · 创作者中心</div>
        <p class="sub">请输入你的新密码。</p>

        <div id="alertBox"></div>

        <form id="resetPasswordForm">
          <div class="field">
            <label for="newPasswordField">新密码</label>
            <div class="password-input-wrap">
              <input type="password" id="newPasswordField" required minlength="6" autocomplete="new-password" placeholder="至少 6 位">
              <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="显示密码" aria-pressed="false">
                <svg id="eyeIconNew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <small class="field-error" id="newPasswordError">密码至少需要 6 位</small>
          </div>
          <div class="field">
            <label for="confirmPasswordField">确认新密码</label>
            <input type="password" id="confirmPasswordField" required minlength="6" autocomplete="new-password" placeholder="再次输入新密码">
            <small class="field-error" id="confirmPasswordError">两次输入的密码不一致</small>
          </div>
          <button type="submit" class="btn" id="resetPasswordSubmitBtn">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">更新密码</span>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/app-core.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
